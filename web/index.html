<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Project Zoe. The ultimate elegant coffee brewing tool. A concept in white.">
<meta name="theme-color" content="#d7d7d5">
<title>Project Zoe | A concept in white</title>
<style>
:root{--bg:#d7d7d5;--fg:#242422;--muted:#565652;--display:'Iowan Old Style',Charter,Georgia,'Times New Roman',serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--fg)}body{-webkit-font-smoothing:antialiased;font-family:var(--body)}.stage{position:relative;isolation:isolate;min-height:720px;height:100svh;overflow:hidden}.model{position:absolute;inset:0;z-index:-1;margin:0}.model picture{display:block;width:100%;height:100%}.model img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}.masthead{position:absolute;top:35px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;gap:20px}.mark{width:29px;height:39px;stroke:currentColor;stroke-width:1.15;fill:none}.concept{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}.title{position:absolute;left:48px;top:40%;transform:translateY(-30%);width:32%;max-width:420px}h1{font-family:var(--display);font-size:clamp(76px,8.6vw,134px);font-weight:400;letter-spacing:-.065em;line-height:.86;margin:0 0 33px;text-wrap:balance}.tagline{font-size:16px;font-weight:400;line-height:1.6;letter-spacing:-.015em;margin:0;max-width:26ch}.footer{position:absolute;bottom:30px;left:48px;right:48px;display:flex;justify-content:space-between;gap:20px;align-items:end;color:var(--muted);font-size:10px;letter-spacing:.02em}.footer span:last-child{font-size:9px;letter-spacing:.14em;text-transform:uppercase}.title{animation:none}@keyframes enter{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}@media(min-aspect-ratio:19/10){.stage{min-height:640px}.model img{object-fit:contain;object-position:right center}.title{top:39%}}@media(max-width:760px){.stage{height:100svh;min-height:880px}.masthead{top:24px;left:24px;right:24px}.mark{width:23px;height:32px}.concept{font-size:8px}.title{top:92px;left:24px;right:24px;max-width:none;width:auto;transform:none;display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:64px;letter-spacing:-.06em;margin:0;line-height:.87}.tagline{font-size:11px;line-height:1.5;max-width:17ch;margin-bottom:2px}.model{top:220px;bottom:45px}.model img{object-fit:cover;object-position:center center}.footer{bottom:22px;left:24px;right:24px;font-size:9px}.footer span:last-child{font-size:8px}}@media(max-width:355px){.title{gap:12px}h1{font-size:57px}.tagline{font-size:10px}}@media(prefers-reduced-motion:reduce){.title{animation:none}}
</style>
</head>
<body>
<main class="stage" data-od-id="white-model-showcase">
<header class="masthead"><svg class="mark" viewBox="0 0 29 39" aria-label="Project Zoe: circle and square"><circle cx="14.5" cy="8" r="6.4"></circle><rect x="3" y="23" width="23" height="12" rx="1.7"></rect></svg><span class="concept">A concept in white</span></header>
<figure class="model"><picture><source media="(max-width: 760px)" srcset="{{white-portrait}}"><img src="{{white-stage}}" alt="Project Zoe white model: a circular crown, open dripper support, and slim rounded base" width="2560" height="1600" fetchpriority="high"></picture></figure>
<div class="title"><h1>project<br>zoe</h1><p class="tagline">The ultimate elegant<br>coffee brewing tool.</p></div>
<footer class="footer"><span>Made for the ritual.</span><span>Project Zoe</span></footer>
</main>
</body>
</html>
