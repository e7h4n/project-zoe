<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Project Zoe. The ultimate elegant coffee brewing tool. Explore silver anodized aluminum and the details of the real 3D assembly.">
<meta name="theme-color" content="#d7d7d5">
<title>Project Zoe | Silver, considered</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#d7d7d5;--fg:#242422;--muted:#565652;--display:'Iowan Old Style',Charter,Georgia,'Times New Roman',serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--fg)}body{-webkit-font-smoothing:antialiased;font-family:var(--body)}.stage{position:relative;isolation:isolate;min-height:760px;height:100svh;overflow:hidden}.masthead{position:absolute;z-index:2;top:35px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;gap:20px;pointer-events:none}.mark{width:29px;height:39px;stroke:currentColor;stroke-width:1.15;fill:none}.concept{font-size:10px;letter-spacing:.09em;color:var(--muted)}.title{position:absolute;z-index:2;left:48px;top:32%;transform:translateY(-30%);width:30%;max-width:420px;pointer-events:none}h1{font-family:var(--display);font-size:clamp(76px,8.6vw,134px);font-weight:400;letter-spacing:-.065em;line-height:.86;margin:0 0 33px;text-wrap:balance}.tagline{font-size:16px;font-weight:400;line-height:1.6;letter-spacing:-.015em;margin:0;max-width:26ch}.model{position:absolute;left:32%;right:22px;top:60px;bottom:65px;margin:0;background:radial-gradient(ellipse at 50% 65%,#ecece733,transparent 70%)}.model canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}.model canvas:active{cursor:grabbing}.model canvas:focus-visible{outline:1px solid #70706a;outline-offset:-5px}.status{position:absolute;top:48%;left:20px;right:20px;text-align:center;font-size:12px;line-height:1.7;color:var(--muted);pointer-events:none}.status a{pointer-events:auto;color:inherit}.status[hidden]{display:none}.reset{position:absolute;right:48px;bottom:79px;z-index:3;font:inherit;font-size:10px;color:var(--muted);background:#f7f7f042;border:1px solid #79797044;border-radius:20px;padding:9px 13px;cursor:pointer}.reset:hover{background:#f7f7f099;color:var(--fg)}button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.details{position:absolute;left:48px;bottom:103px;z-index:3;width:27%;max-width:330px}.details h2{font-size:12px;font-weight:500;margin:0 0 14px}.view-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.view-button{font:inherit;font-size:11px;text-align:left;min-height:38px;padding:10px 12px;border:1px solid #79797055;border-radius:6px;color:var(--muted);background:#f7f7f022;cursor:pointer;transition:background .15s,color .15s}.view-button:hover{background:#f7f7f088;color:var(--fg)}.view-button[aria-pressed=true]{background:#30312f;color:#f8f8f3;border-color:#30312f}.view-caption{font-size:11px;line-height:1.6;color:var(--muted);min-height:36px;margin:13px 0 0;max-width:32ch}.footer{position:absolute;z-index:2;bottom:30px;left:48px;right:48px;display:flex;justify-content:space-between;gap:20px;align-items:end;color:var(--muted);font-size:10px;letter-spacing:.02em;pointer-events:none}.footer span:last-child{font-size:9px;letter-spacing:.14em;text-transform:uppercase}.touch-hint{display:none}
@media(max-width:760px){.stage{height:100svh;min-height:810px}.masthead{top:24px;left:24px;right:24px}.mark{width:23px;height:32px}.concept{font-size:9px}.title{top:92px;left:24px;right:24px;max-width:none;width:auto;transform:none;display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:64px;letter-spacing:-.06em;margin:0;line-height:.87}.tagline{font-size:11px;line-height:1.5;max-width:17ch;margin-bottom:2px}.model{top:210px;bottom:246px;left:8px;right:8px}.reset{right:24px;bottom:207px}.details{left:24px;right:24px;bottom:63px;width:auto;max-width:none}.details h2{font-size:11px;margin-bottom:9px}.view-buttons{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.view-button{font-size:10px;padding:9px 8px;min-height:36px}.view-caption{font-size:10px;min-height:32px;max-width:none;margin-top:9px}.footer{bottom:24px;left:24px;right:24px;font-size:9px;gap:10px}.footer span:last-child{font-size:8px}.desktop-hint{display:none}.touch-hint{display:inline}}
@media(max-width:355px){h1{font-size:57px}.tagline{font-size:10px}.footer{font-size:8px}.view-button{font-size:9px}}
@media(prefers-reduced-motion:reduce){.view-button{transition:none}}
</style>
</head>
<body>
<main class="stage" data-od-id="interactive-silver-model-showcase">
<header class="masthead"><svg class="mark" viewBox="0 0 29 39" aria-label="Project Zoe: circle and square"><circle cx="14.5" cy="8" r="6.4"></circle><rect x="3" y="23" width="23" height="12" rx="1.7"></rect></svg><span class="concept">Silver anodized aluminum</span></header>
<div class="model" id="model-viewer" data-model="{{glb}}" data-draco="{{draco}}" aria-label="Interactive Project Zoe 3D model">
<canvas id="model-canvas" tabindex="0" aria-label="Project Zoe 3D view. Left drag to rotate, right drag to pan, scroll to zoom. Arrow keys pan, plus or minus zoom, R resets the view." aria-describedby="viewer-help"></canvas>
<p class="status" id="viewer-status" role="status" aria-live="polite">Loading model…</p>
<noscript><p class="status">Enable JavaScript to explore the 3D model.<br><a href="{{glb}}" download>Download the GLB model</a></p></noscript>
</div>
<div class="title"><h1>project<br>zoe</h1><p class="tagline">The ultimate elegant<br>coffee brewing tool.</p></div>
<nav class="details" aria-label="Preset model views">
<h2>Explore the details</h2>
<div class="view-buttons">
<button class="view-button" type="button" data-view="overall" aria-pressed="true" disabled>Overall</button>
<button class="view-button" type="button" data-view="surface" aria-pressed="false" disabled>Weighing surface</button>
<button class="view-button" type="button" data-view="rear" aria-pressed="false" disabled>Rear joint</button>
<button class="view-button" type="button" data-view="edge" aria-pressed="false" disabled>Edge radius</button>
<button class="view-button" type="button" data-view="underside" aria-pressed="false" disabled>Underside</button>
<button class="view-button" type="button" data-view="rearUnderside" aria-pressed="false" disabled>Rear underside</button>
</div>
<p class="view-caption" id="view-caption" aria-live="polite">Silver anodized aluminum. A satin finish, considered from every angle.</p>
</nav>
<button class="reset" id="reset-view" type="button" disabled>Reset view</button>
<footer class="footer"><span id="viewer-help"><span class="desktop-hint">Left drag: rotate · Right drag: pan · Scroll: zoom</span><span class="touch-hint">One finger: rotate · Two fingers: pan / zoom</span></span><span>Project Zoe</span></footer>
</main>
<script type="module" src="{{viewer}}"></script>
</body>
</html>
