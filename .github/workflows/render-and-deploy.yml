name: Render model and deploy website

on:
  push:
    branches: [main]
    paths:
      - 'model/**'
      - 'web/**'
      - 'scripts/**'
      - 'requirements-render.txt'
      - '.github/workflows/render-and-deploy.yml'
  pull_request:
    paths:
      - 'model/**'
      - 'web/**'
      - 'scripts/**'
      - 'requirements-render.txt'
      - '.github/workflows/render-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-render.txt
      - name: Install headless render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxi6 libxrender1
          python -m pip install -r requirements-render.txt
      - name: Render Blender source and build website
        run: python scripts/render_site.py --out dist
      - name: Check the website and render provenance
        run: python scripts/check_site.py dist
      - name: Upload rendered preview (including pull requests)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-website
          path: dist/
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy rendered website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
