name: Export GLB and deploy interactive website

on:
  push:
    branches: [main]
    paths:
      - 'model/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-export.txt'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.github/workflows/export-and-deploy.yml'
  pull_request:
    paths:
      - 'model/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-export.txt'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.github/workflows/export-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-export.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install headless Blender and web dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxi6 libxrender1
          python -m pip install -r requirements-export.txt
          npm ci
      - name: Export GLB and build website
        run: npm run build
      - name: Install browser for interaction tests
        run: npx playwright install --with-deps chromium
      - name: Test mouse, keyboard and touch controls
        run: npm test
      - name: Upload website and QA screenshots (including pull requests)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interactive-website-and-qa
          path: |
            dist/
            test-results/
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy interactive website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
